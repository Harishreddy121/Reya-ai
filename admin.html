<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090909"><title>REYA | Admin</title>
<style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#21190e,#080808 65%);color:#f3eee3;font:14px Inter,system-ui,Arial}.wrap{max-width:760px;margin:35px auto;padding:24px}.panel{background:#14110d;border:1px solid #6d512a;border-radius:12px;padding:24px;box-shadow:0 20px 55px #0008}.brand{text-align:center;font:700 32px Georgia,serif;letter-spacing:5px;color:#f4e4bd}.sub{text-align:center;color:#c9a35b;font-size:9px;letter-spacing:2px;margin:5px 0 28px}.eyebrow{color:#c9a35b;font-size:10px;letter-spacing:2px;font-weight:800}h1{font:700 28px Georgia,serif;margin:8px 0 22px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{display:flex;flex-direction:column;gap:7px}.field.full{grid-column:1/-1}label{font-size:10px;letter-spacing:1px;color:#d9c8a7;font-weight:800}input,select,textarea{width:100%;background:#0b0a09;border:1px solid #55432a;color:#f3eee3;padding:12px;border-radius:5px;min-height:44px}textarea{min-height:82px;resize:vertical}input[type=file]{padding:9px}button{border:1px solid #e1c17d;background:linear-gradient(135deg,#d8b56e,#a77b35);color:#100d08;padding:14px 18px;border-radius:5px;font-weight:900;cursor:pointer;width:100%;margin-top:18px}.hint{color:#a99d8a;font-size:11px;line-height:1.6}.status{margin-top:15px;color:#e4c17a;white-space:pre-wrap;line-height:1.6}.preview{display:flex;gap:10px;margin-top:8px}.preview img{width:90px;height:110px;object-fit:contain;background:#242019;border:1px solid #55432a;border-radius:5px}.hide{display:none!important}@media(max-width:560px){.wrap{padding:12px;margin:12px auto}.panel{padding:18px}.grid{grid-template-columns:1fr}.field.full{grid-column:auto}}
</style></head><body><main class="wrap"><section class="panel"><div class="brand">REYA</div><div class="sub">PRIVATE PRODUCT ADMIN</div>
<div id="login"><div class="eyebrow">ADMIN ACCESS</div><h1>Sign in</h1><div class="field"><label>ADMIN PASSWORD</label><input id="password" type="password" autocomplete="current-password" placeholder="Enter admin password"></div><button id="loginBtn">UNLOCK ADMIN</button><p class="hint">Your password is checked by the server. It is not stored in this page.</p></div>
<form id="productForm" class="hide"><div class="eyebrow">NEW COLLECTION</div><h1>Add Product</h1><div class="grid">
<div class="field full"><label>PRODUCT NAME</label><input id="name" required maxlength="70" placeholder="e.g. Divine Shadow Oversized Tee"></div>
<div class="field"><label>PRICE (₹)</label><input id="price" type="number" min="1" max="100000" required value="499"></div>
<div class="field"><label>CATEGORY</label><select id="category"><option>Men Oversized</option><option>Men Regular</option><option>Women</option></select></div>
<div class="field full"><label>FRONT IMAGE</label><input id="front" type="file" accept="image/png,image/jpeg,image/webp" required><div id="frontPreview" class="preview"></div></div>
<div class="field full"><label>BACK IMAGE (OPTIONAL)</label><input id="back" type="file" accept="image/png,image/jpeg,image/webp"><div id="backPreview" class="preview"></div></div>
<div class="field full"><label>DESCRIPTION</label><textarea id="description" maxlength="300" placeholder="Short product description"></textarea></div>
</div><p class="hint">Images are saved in the GitHub repository under <b>images/products/</b>. Product details are saved to products.json.</p><button type="submit" id="saveBtn">UPLOAD IMAGES & ADD PRODUCT</button><div id="status" class="status" role="status"></div></form>
</section></main>
<script>
let adminPassword="";
const $=id=>document.getElementById(id);
async function api(body){const r=await fetch("/api/admin",{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+adminPassword},body:JSON.stringify(body)});const data=await r.json().catch(()=>({error:"Invalid server response"}));if(!r.ok)throw new Error(data.error||"Request failed");return data}
$("loginBtn").onclick=async()=>{adminPassword=$("password").value;if(!adminPassword)return;$("loginBtn").disabled=true;try{await api({action:"check"});$("login").classList.add("hide");$("productForm").classList.remove("hide")}catch(e){alert(e.message);adminPassword=""}finally{$("loginBtn").disabled=false}};
function preview(input,target){$(input).onchange=()=>{$(target).innerHTML="";const f=$(input).files[0];if(f){const im=document.createElement("img");im.src=URL.createObjectURL(f);$(target).append(im)}}}
preview("front","frontPreview");preview("back","backPreview");
function cleanName(s){return s.toLowerCase().trim().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g)}
async function upload(file,base){if(!file)return "";if(file.size>8*1024*1024)throw new Error(file.name+" is over 8 MB. Please resize it.");const bytes=new Uint8Array(await file.arrayBuffer());let binary="";for(let i=0;i<bytes.length;i+=0x8000)binary+=String.fromCharCode(...bytes.subarray(i,i+0x8000));const data=await api({action:"upload",name:base,content:btoa(binary),mime:file.type});return data.path}
$("productForm").onsubmit=async e=>{e.preventDefault();$("saveBtn").disabled=true;$("status").textContent="Uploading front image…";try{const name=$("name").value.trim(),slug=cleanName(name);const front=await upload($("front").files[0],slug+"-front");$("status").textContent="Front image uploaded. Uploading back image…";const back=$("back").files[0]?await upload($("back").files[0],slug+"-back"):"";$("status").textContent="Saving product details…";const result=await api({action:"addProduct",product:{id:slug,name,price:Number($("price").value),category:$("category").value,front,back,description:$("description").value.trim()}});$("status").textContent="Product added successfully.\nFront: "+front+(back?"\nBack: "+back:"")+"\n"+result.message;$("productForm").reset();$("frontPreview").innerHTML="";$("backPreview").innerHTML=""}catch(err){$("status").textContent="Error: "+err.message}finally{$("saveBtn").disabled=false}};
</script></body></html>
